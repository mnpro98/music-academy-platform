apiVersion: v1
kind: ConfigMap
metadata:
  name: benthos-config
  namespace: default
data:
  config.yaml: |
    input:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://localhost:4222}" ]
        stream: "ACADEMY_EVENTS"
        subject: "academy.student.StudentRegistered"
        durable: "benthos_processor_mon"
        deliver: "all"
        ack_wait: 30s

    pipeline:
      processors:
        - mapping: |
            root = if this.amount_owed <= 0 {
              deleted()
            } else {
              {
                "student_id": this.id,
                "full_name": this.first_name + " " + this.last_name,
                "instrument": this.instrument,
                "program": this.program,
                "financials": {
                  "amount_owed": this.amount_owed,
                  "status": "unpaid"
                },
                "processed_at": now()
              }
            }

    output:
      mongodb:
        url: "${MONGO_URL:mongodb://localhost:27017}"
        database: "academy_analytics"
        collection: "student_ledgers"
        operation: "update-one"
        upsert: true
        write_concern:
          w: "1"
        filter_map: |
          root.student_id = this.student_id
        document_map: |
          root = { "$set": this }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos-pipeline
  labels:
    app: benthos-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benthos-pipeline
  template:
    metadata:
      labels:
        app: benthos-pipeline
    spec:
      containers:
        - name: benthos
          image: jeffail/benthos:4.24.0
          args: ["-c", "/config/config.yaml"]
          env:
            # Point Benthos to the internal Kubernetes DNS name for NATS
            - name: NATS_URL
              value: "nats://nats:4222"
            # Point Benthos to the internal Kubernetes DNS name for MongoDB
            - name: MONGO_URL
              value: "mongodb://secondary-db:27017"
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            # Mount the config file inside the container directory expected by the engine
            - name: config-volume
              mountPath: /config
      volumes:
        # Pull the text content out of the ConfigMap above
        - name: config-volume
          configMap:
            name: benthos-config