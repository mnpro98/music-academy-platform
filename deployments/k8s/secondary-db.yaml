apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondary-db
  labels:
    app: secondary-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secondary-db
  template:
    metadata:
      labels:
        app: secondary-db
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          # NATIVE INFRASTRUCTURE INITIALIZATION LAYER
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # 1. Loop until MongoDB is active and accepting command pings locally
                    until mongosh --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do
                      sleep 1
                    done
                    
                    # 2. Assert the unique analytical index required by the Benthos pipeline
                    mongosh academy_analytics --eval "db.student_ledgers.createIndex({ student_id: 1 }, { unique: true })"
---
apiVersion: v1
kind: Service
metadata:
  name: secondary-db
spec:
  selector:
    app: secondary-db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP